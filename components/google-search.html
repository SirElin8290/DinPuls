<section class="google-search-band" aria-label="Sök på webben">
  <div class="google-search-inner">
    <div class="google-search-heading">
      <span class="google-search-icon"><i data-lucide="globe-2"></i></span>
      <span><strong>Sök på Google</strong><small>Sökningen öppnas på google.se</small></span>
    </div>
    <form class="google-search-form" action="https://www.google.se/search" method="get" role="search">
      <i data-lucide="search" aria-hidden="true"></i>
      <label class="visually-hidden" for="google-search-query">Sök på Google</label>
      <input id="google-search-query" name="q" type="search" placeholder="Vad vill du söka efter på webben?" autocomplete="on" required>
      <input type="hidden" name="hl" value="sv">
      <button type="submit">Sök på Google <i data-lucide="arrow-right"></i></button>
    </form>
  </div>
</section>
