<section class="homepage-guide" aria-label="Gör DinPuls till startsida">
  <div class="homepage-guide-inner">
    <span class="homepage-guide-icon"><i data-lucide="home"></i></span>
    <span class="homepage-guide-copy"><strong>Börja alltid med DinPuls</strong><small>Låt DinPuls.se öppnas automatiskt när du startar webbläsaren.</small></span>
    <button class="homepage-guide-open" type="button" data-homepage-guide-open>Gör DinPuls till startsida <i data-lucide="arrow-right"></i></button>
  </div>
</section>
<dialog class="homepage-dialog" id="homepage-dialog" aria-labelledby="homepage-dialog-title">
  <div class="homepage-dialog-inner">
    <button class="homepage-dialog-close" type="button" data-homepage-guide-close aria-label="Stäng guiden"><i data-lucide="x"></i></button>
    <span class="homepage-dialog-icon"><i data-lucide="home"></i></span>
    <span class="section-kicker">Din lokala startsida</span>
    <h2 id="homepage-dialog-title">Öppna DinPuls när webbläsaren startar</h2>
    <p class="homepage-dialog-intro">Välj din webbläsare och följ stegen. Av säkerhetsskäl behöver du själv bekräfta ändringen i webbläsarens inställningar.</p>
    <div class="homepage-browser-tabs" role="tablist" aria-label="Välj webbläsare">
      <button type="button" role="tab" data-homepage-browser="chrome">Chrome</button>
      <button type="button" role="tab" data-homepage-browser="edge">Edge</button>
      <button type="button" role="tab" data-homepage-browser="firefox">Firefox</button>
      <button type="button" role="tab" data-homepage-browser="safari">Safari</button>
    </div>
    <div class="homepage-instructions" data-homepage-instructions></div>
    <div class="homepage-url-row"><code>https://dinpuls.se</code><button type="button" data-copy-homepage-url><i data-lucide="copy"></i> Kopiera adressen</button></div>
    <p class="homepage-copy-status" data-homepage-copy-status role="status" aria-live="polite"></p>
  </div>
</dialog>
