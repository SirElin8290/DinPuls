<body>
  <header class="portal-header">

    <a href="index.html">← Till startsidan</a>

  <main class="portal-main sport-hub">
    <section class="sport-hub-hero">
      <div>
        <span class="section-kicker">Lokalt engagemang</span>
        <h1>Föreningar &amp; fritid i <span id="sport-hub-place">Åmål</span></h1>

    <section class="sport-hub-toolbar" aria-label="Välj kommun och sport">
      <label>Kommun<select id="sport-hub-municipality"></select></label>
      <label>Aktivitet<select id="sport-hub-sport"><option value="all">Alla aktiviteter</option></select></label>
      <p id="sport-hub-freshness"><i data-lucide="shield-check"></i> Lokala och officiella källor</p>
    </section>

    <section class="sport-hub-summary" id="sport-hub-summary" aria-live="polite"></section>

    <section id="sport-hub-view" class="sport-hub-view" aria-live="polite">
      <div class="sport-hub-loading">Hämtar lokala föreningar och aktiviteter…</div>
    </section>

  <script src="assets/vendor/lucide.min.js"></script>
