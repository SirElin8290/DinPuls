name: Uppdatera bioprogram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_cinemas.py"
      - "scripts/sync_cinema_forshaga_from_events.py"
      - "scripts/sync_cinema_hagfors_from_varmland.py"
      - "scripts/test_update_cinemas.py"
      - "scripts/test_sync_cinema_forshaga.py"
      - "scripts/test_sync_cinema_hagfors.py"
      - "scripts/test_dals_ed_imports.py"
      - "data/events.json"
      - ".github/workflows/update-cinemas.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-cinema-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Testa bioprogram
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_cinemas.py scripts/test_sync_cinema_forshaga.py scripts/test_sync_cinema_hagfors.py scripts/test_dals_ed_imports.py
      - name: Uppdatera bioprogram
        run: |
          python scripts/update_cinemas.py
          python scripts/sync_cinema_forshaga_from_events.py
          python scripts/sync_cinema_hagfors_from_varmland.py
      - name: Verifiera Forshaga och Hagfors bio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/cinemas.json').read_text(encoding='utf-8'))
          checks = {
              'Forshaga': 'https://www.visitvarmland.com/forshaga/evenemang',
              'Hagfors': 'https://www.varmland.bio/bio-hagfors/',
          }
          for municipality, source in checks.items():
              venues = data.get('municipalities', {}).get(municipality) or []
              assert venues, f'{municipality} saknar biografpost'
              cinema = venues[0]
              films = cinema.get('films') or []
              assert films, f'{municipality} saknar framtida verifierade biofilmer'
              assert cinema.get('programStatus') in {'ok', 'stale'}, f'{municipality} bioprogram saknar säker status'
              assert cinema.get('programSource') == source
              for film in films:
                  assert film.get('title') and film.get('showtimes'), f'Ogiltig {municipality}-film: {film}'
                  assert all('T' in value and ('+01:00' in value or '+02:00' in value) for value in film['showtimes']), f'Ogiltig visningstid: {film}'
              print(f"{municipality} bio: {len(films)} filmer / {sum(len(f.get('showtimes', [])) for f in films)} framtida visningar, status={cinema.get('programStatus')}")
          PY
      - name: Publicera ändring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cinemas.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera bioprogram"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1
