name: Uppdatera skolmat
on:
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-school-meals
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.10.0
      - run: python scripts/build_school_coverage.py
      - run: python scripts/update_school_meals.py
      - name: Spara ändrad skolmat
        run: |
          if git diff --quiet -- data/school-family.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/school-family.json
          git commit -m "Uppdatera skolmat"
          git push
