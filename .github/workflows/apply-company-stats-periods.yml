name: Applicera statistikperioder för företagsportalen

on:
  push:
    paths:
      - 'scripts/apply-company-stats-periods.mjs'
      - '.github/workflows/apply-company-stats-periods.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Applicera ändringen
        run: node scripts/apply-company-stats-periods.mjs
      - name: Kontrollera JavaScript
        run: |
          node --check foretag/stats-periods.js
          node --check cloudflare/push-worker.js
      - name: Spara ändringen
        run: |
          if git diff --quiet; then
            echo "Inga ändringar behövdes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foretag/index.html cloudflare/push-worker.js
          git commit -m "Lägg till dag vecka månad år i företagsstatistik"
          git push
