name: Update local deviations
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-local-deviations
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update verified deviations
        run: python scripts/update_deviations.py
      - name: Test pipeline and UI contract
        run: |
          python -m unittest scripts/test_update_deviations.py
          node scripts/test_deviation_engine.js
          node scripts/test_deviation_ui.js
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/deviations.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deviations.json
          git commit -m "data: update local deviations"
          git push
