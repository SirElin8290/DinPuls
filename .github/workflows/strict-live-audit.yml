name: STRICT LIVE 100 audit

# Auditen ska alltid läsa publicerad live-data. Manuell omkörningsväg efter kommunfixar.
# Färgelanda/Hammarö/Karlstad/Kristinehamn/Munkfors verifieras först efter publicerad Pages-data.
# Kristinehamn lunch omverifieras 2026-09-08 efter publicerad aktiv lunch.json.
# Munkfors omverifieras 2026-09-08 efter lyckad Pages-publicering av den beständiga STRICT-kompletteringen.
on:
  push:
    branches: [main]
    paths:
      - 'DINPULS-AUDIT-RULES.md'
      - 'scripts/audit_strict_live_100.py'
      - 'data/housing.json'
      - 'data/housing-hammaro-supplement.json'
      - 'scripts/apply_hammaro_housing.py'
      - 'data/service.json'
      - 'data/service-private-supplement.json'
      - 'data/service-launch-supplement.json'
      - 'data/service-local-supplement.json'
      - 'data/health.json'
      - 'data/health-private.json'
      - 'data/health-private-supplement.json'
      - 'data/health-local-supplement.json'
      - 'data/health-karlstad-private-supplement.json'
      - 'data/health-fargelanda-supplement.json'
      - 'data/health-eda-supplement.json'
      - 'health-page.js'
      - 'data/association-hammaro-supplement.json'
      - 'data/association-hagfors-supplement.json'
      - 'data/association-sunne-supplement.json'
      - 'data/association-dals-ed-supplement.json'
      - 'data/association-filipstad-supplement.json'
      - 'data/sports-fargelanda-supplement.json'
      - 'data/sports.json'
      - 'data/leisure.json'
      - 'data/events.json'
      - 'data/events-kil-supplement.json'
      - 'scripts/apply_kil_events.py'
      - 'data/events-saffle-supplement.json'
      - 'scripts/apply_saffle_events.py'
      - 'data/events-fargelanda-supplement.json'
      - 'scripts/apply_fargelanda_events.py'
      - 'data/lunch.json'
      - 'data/lunch-launch-supplement.json'
      - 'data/lunch-hammaro-supplement.json'
      - 'data/lunch-storfors-supplement.json'
      - 'scripts/apply_storfors_lunch.py'
      - 'data/authorities.json'
      - 'data/authorities-hagfors-supplement.json'
      - 'data/authorities-arjang-supplement.json'
      - 'data/authorities-arvika-supplement.json'
      - 'myndigheter-page.js'
      - '.github/workflows/strict-live-audit.yml'
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    if: >-
      ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_commit.message != 'Uppdatera STRICT LIVE 100 kommunrapport') }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Kör STRICT LIVE 100 audit
        run: python scripts/audit_strict_live_100.py
      - name: Publicera senaste auditrapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STRICT-LIVE-AUDIT-LATEST.md
          if git diff --cached --quiet; then
            echo 'Ingen rapportändring att committa.'
            exit 0
          fi
          git commit -m 'Uppdatera STRICT LIVE 100 kommunrapport'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'STRICT-rapport publicerad.'
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 3))
          done
          echo 'Kunde inte publicera STRICT-rapporten efter fyra försök.' >&2
          exit 1
