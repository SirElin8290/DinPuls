name: Uppdatera Missing People

on:
  workflow_dispatch:
  push:
    paths:
      - "data/municipalities.json"
      - "scripts/update_missing_people.py"
      - "scripts/test_update_missing_people.py"
      - ".github/workflows/update-missing-people.yml"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-missing-people
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testa kommunfördelningen
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_missing_people.py

      - name: Hämta officiella efterlysningar
        run: python scripts/update_missing_people.py

      - name: Spara verifierad data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/missing-people.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera Missing People"
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
