name: Applicera Missing People åldersvisning

on:
  push:
    paths:
      - "scripts/apply_missing_people_age_ui.py"
      - ".github/workflows/apply-missing-people-age-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Applicera 1-årsgräns och kompakt äldre-visning
        run: python scripts/apply_missing_people_age_ui.py

      - name: Kontrollera att äldre-vyn finns
        run: |
          grep -q "renderOlderMissingPeople" script.js
          grep -q "missing-people-older" components/missing-people.html

      - name: Spara ändringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js components/missing-people.html
          if ! git diff --cached --quiet; then
            git commit -m "Visa äldre Missing People-fall kompakt"
            git pull --rebase
            git push
          fi
