name: Uppdatera föreningar och idrott

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/municipalities.json"
      - "data/leisure-curated.json"
      - "data/leisure-enrichment.json"
      - "data/sports-curated.json"
      - "data/association-launch-supplement.json"
      - "data/association-priority-supplement.json"
      - "data/association-wave2-supplement.json"
      - "data/association-wave3-supplement.json"
      - "data/association-wave4-supplement.json"
      - "data/association-hammaro-supplement.json"
      - "data/association-forshaga-supplement.json"
      - "data/association-hagfors-supplement.json"
      - "data/association-enrichment-prerequisites.json"
      - "scripts/import_associations.py"
      - "scripts/apply_forshaga_fri.py"
      - "scripts/test_forshaga_fri.py"
      - "scripts/apply_launch_associations.py"
      - "scripts/apply_leisure_enrichment.py"
      - "scripts/normalize_association_boundaries.py"
      - ".github/workflows/update-associations.yml"
  schedule:
    - cron: "20 3 * * 1"

permissions:
  contents: write

concurrency:
  group: dinpuls-association-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Importera föreningsregister
        run: python scripts/import_associations.py

      - name: Importera Forshagas FRI-register
        run: python scripts/apply_forshaga_fri.py

      - name: Lägg till verifierad lanseringstäckning
        run: python scripts/apply_launch_associations.py

      - name: Applicera verifierad fritidsberikning
        run: python scripts/apply_leisure_enrichment.py

      - name: Säkerställ gränsen mellan Fritid och Idrott
        run: python scripts/normalize_association_boundaries.py

      - name: Verifiera alla kommuner
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          for filename in ('data/leisure.json', 'data/sports.json'):
              data = json.loads(Path(filename).read_text(encoding='utf-8'))
              got = set(data.get('municipalities', {}))
              assert got == expected, f'{filename}: expected={sorted(expected)}, got={sorted(got)}'
          launch = json.loads(Path('data/association-launch-supplement.json').read_text(encoding='utf-8'))
          sports = json.loads(Path('data/sports.json').read_text(encoding='utf-8'))['municipalities']
          leisure = json.loads(Path('data/leisure.json').read_text(encoding='utf-8'))['municipalities']
          for name in launch.get('municipalities', {}):
              assert sports.get(name, {}).get('clubs'), f'{name}: launch sport coverage missing'
              assert leisure.get(name, {}).get('activities'), f'{name}: launch leisure coverage missing'
          hammaro_sports = sports.get('Hammarö', {}).get('clubs') or []
          hammaro_leisure = leisure.get('Hammarö', {}).get('activities') or []
          assert len(hammaro_sports) >= 10, f'Hammarö: för få idrottsföreningar: {len(hammaro_sports)}'
          assert len(hammaro_leisure) >= 15, f'Hammarö: för få fritidsposter: {len(hammaro_leisure)}'
          forshaga_sports = sports.get('Forshaga', {}).get('clubs') or []
          forshaga_leisure = leisure.get('Forshaga', {}).get('activities') or []
          assert len(forshaga_sports) >= 18, f'Forshaga: för få idrottsföreningar: {len(forshaga_sports)}'
          assert len(forshaga_leisure) >= 10, f'Forshaga: för få fritidsföreningar: {len(forshaga_leisure)}'
          hagfors_sports = sports.get('Hagfors', {}).get('clubs') or []
          hagfors_leisure = leisure.get('Hagfors', {}).get('activities') or []
          assert len(hagfors_sports) >= 10, f'Hagfors: för få idrottsföreningar: {len(hagfors_sports)}'
          assert len(hagfors_leisure) >= 10, f'Hagfors: för få fritidsposter: {len(hagfors_leisure)}'
          print(f'Verifierade föreningsdata för {len(expected)} kommuner; Hammarö {len(hammaro_sports)} idrott/{len(hammaro_leisure)} fritid; Forshaga {len(forshaga_sports)} idrott/{len(forshaga_leisure)} fritid; Hagfors {len(hagfors_sports)} idrott/{len(hagfors_leisure)} fritid')
          PY
          PYTHONPATH=scripts python -m unittest scripts/test_forshaga_fri.py
          node scripts/test_leisure_quality.js
          node scripts/test_leisure_ui.js

      - name: Publicera föreningsdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leisure.json data/sports.json
          if git diff --cached --quiet; then
            echo "Föreningsdatan är redan aktuell."
            exit 0
          fi
          git commit -m "Uppdatera föreningar och idrott"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
