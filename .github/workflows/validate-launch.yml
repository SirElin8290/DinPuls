name: Kontrollera DinPuls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repo
        uses: actions/checkout@v4

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera beroenden
        run: npm ci

      - name: Kontrollera JavaScript-syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts admin foretag cloudflare -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Kör lanseringstester
        run: npm test

      - name: Kontrollera statistik och samtycke
        run: |
          node scripts/test_analytics_consent.js
          node scripts/test_analytics_events.js

      - name: Kontrollera föreningarnas publiceringsgrind och profilsidor
        run: |
          node scripts/test_association_publication.js
          node scripts/test_association_profile_runtime.js

      - name: Kontrollera kommunernas datatäckning
        run: python scripts/audit_municipality_readiness.py

      - name: Kontrollera Hammarös slutkontrakt
        run: python scripts/test_hammaro_readiness.py

      - name: Kontrollera sportmodulens avgränsning
        run: node scripts/check-sport-boundaries.js

      - name: Kontrollera nattlig källbevakning
        run: |
          PYTHONPATH=scripts python -m unittest scripts/test_public_sources.py scripts/test_system_health.py
          node scripts/test_source_monitor_admin.js
