name: Kontrollera DinPuls

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dinpuls-launch-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kontrollera sidor, kommuner och data
        run: |
          for test in scripts/test_*.py; do python "$test"; done
          python scripts/validate_launch.py

      - name: Kontrollera JavaScript
        run: |
          for file in *.js admin/*.js foretag/*.js cloudflare/*.js scripts/*.js; do [ -f "$file" ] && node --check "$file"; done
          for test in scripts/test_*.js; do node "$test"; done
          npm ci
          npm run test:banner
