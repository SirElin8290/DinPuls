name: Kontrollera och återställ UI-läsbarhet
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'ui-resilience.js'
      - 'privacy-controls.js'
      - 'season-theme.css'
      - 'styles.css'
      - 'scripts/check_ui_quality.py'
      - '.github/workflows/ui-quality.yml'
permissions:
  contents: write
concurrency:
  group: dinpuls-ui-quality
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installera webbläsarkontrollen
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          node scripts/test_ui_resilience.js
      - name: Vänta in publicerad UI-kod
        run: |
          python - <<'PY'
          import time, urllib.request
          from pathlib import Path
          expected=Path('ui-resilience.js').read_bytes()
          for attempt in range(40):
              try:
                  actual=urllib.request.urlopen('https://dinpuls.se/ui-resilience.js?version=1.0.1',timeout=15).read()
                  if actual==expected: break
              except Exception: pass
              time.sleep(15)
          else: raise SystemExit('UI-koden är ännu inte publicerad; ingen falsk grön kontroll.')
          PY
      - name: Kontrollera alla 21 kommuner på desktop och mobil
        id: ui
        continue-on-error: true
        run: python scripts/check_ui_quality.py
      - name: Publicera faktisk kontrollstatus
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/ui-quality.json ]; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ui-quality.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publicera automatisk UI-kontroll för 21 kommuner'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-quality
          path: data/ui-quality.json
      - name: Markera kvarstående fel
        if: always()
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/ui-quality.json').read_text())
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write(f"UI: {report['checks']} kontroller, {len(report['issues'])} kvarstående fel.\n")
              for issue in report['issues']: out.write('- '+json.dumps(issue,ensure_ascii=False)+'\n')
          if __import__('os').environ['UI_OUTCOME'] != 'success': raise SystemExit('Webbläsarkontrollen slutfördes inte utan fel.')
          if report['issues']: raise SystemExit('Kvarstående UI-fel kräver åtgärd; rapporten är publicerad.')
          PY
