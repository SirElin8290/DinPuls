name: Applicera regional liveflygvisning

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-flight-region-live-ui.yml"
      - "scripts/apply_flight_region_live_ui.py"

permissions:
  contents: write

concurrency:
  group: dinpuls-flight-region-live-ui
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Applicera flygvisningen
        run: python scripts/apply_flight_region_live_ui.py
      - name: Verifiera flygvisningen
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('script.js').read_text(encoding='utf-8')
          assert 'item.audiences.includes(flightAudience)' in script
          assert 'Göteborg Stallbacka' in script
          assert 'item.statusText' in script
          assert 'Promise.all([loadTransport(), loadFlights()])' in script
          print('Verifierat: regionfilter, live-status och 15-minuters omladdning finns')
          PY
      - name: Publicera ändringen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then
            echo "Flygvisningen är redan applicerad."
            exit 0
          fi
          git commit -m "Styr flygavgångar efter landskap och livestatus"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
