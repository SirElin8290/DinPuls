name: Promovera Kil Sunne och Eda

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/promote-kil-sunne-eda.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-promote-kil-sunne-eda
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installera beroenden
        run: npm ci

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifiera målkommunernas innehåll
        shell: python
        run: |
          import json
          from pathlib import Path

          targets = ("Kil", "Sunne", "Eda")
          data = Path("data")

          def load(name):
              return json.loads((data / name).read_text(encoding="utf-8"))

          jobs = load("jobs.json").get("municipalities", {})
          weather = load("weather-live.json").get("municipalities", {})
          transport = load("transport.json").get("municipalities", {})
          events = load("events.json").get("municipalities", {})
          lunch = load("lunch.json").get("municipalities", {})
          sports = load("sports.json").get("municipalities", {})
          leisure = load("leisure.json").get("municipalities", {})
          news = load("news.json").get("articles", [])

          health_items = []
          for filename in ("health.json", "health-private.json", "health-private-supplement.json"):
              p = load(filename)
              health_items.extend(p.get("providers", []) if isinstance(p.get("providers"), list) else [])

          service_items = []
          for filename in ("service.json", "service-private-supplement.json", "service-launch-supplement.json"):
              p = load(filename)
              service_items.extend(p.get("businesses", []) if isinstance(p.get("businesses"), list) else [])

          failures = []
          for name in targets:
              checks = {
                  "jobb": bool(jobs.get(name, {}).get("jobs")),
                  "väder": bool(weather.get(name, {}).get("nowcast", {}).get("current", {}).get("time")),
                  "kollektivtrafik": bool(transport.get(name, {}).get("stops")),
                  "evenemang": bool(events.get(name, {}).get("events") or events.get(name, {}).get("sourceHealth")),
                  "lunch": bool(lunch.get(name, {}).get("restaurants") or lunch.get(name, {}).get("referenceSources")),
                  "sport": bool(sports.get(name, {}).get("clubs")),
                  "fritid": bool(leisure.get(name, {}).get("activities")),
                  "nyheter": any(name in (article.get("municipalities") or []) for article in news if isinstance(article, dict)),
                  "vård": any(item.get("municipality") == name for item in health_items if isinstance(item, dict)),
                  "service": any(item.get("municipality") == name for item in service_items if isinstance(item, dict)),
              }
              missing = [label for label, ok in checks.items() if not ok]
              if missing:
                  failures.append(f"{name}: {', '.join(missing)}")
              print(name, checks)

          if failures:
              raise SystemExit("Promotion stoppad; innehåll saknas: " + "; ".join(failures))

      - name: Promovera målkommunerna
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("data/municipalities.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          targets = {"Kil", "Sunne", "Eda"}
          found = set()
          for municipality in payload.get("municipalities", []):
              name = municipality.get("name")
              if name not in targets:
                  continue
              found.add(name)
              municipality.pop("launchMode", None)
          if found != targets:
              raise SystemExit(f"Promotion stoppad; kommuner saknas: {sorted(targets - found)}")
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Promoverade:", ", ".join(sorted(found)))

      - name: Kör grundtester
        run: npm test

      - name: Publicera promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/municipalities.json
          if git diff --cached --quiet; then
            echo "Kil, Sunne och Eda är redan i produktion."
            exit 0
          fi
          git commit -m "Promovera Kil Sunne och Eda"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
