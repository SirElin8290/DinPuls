name: Korrigera servicekontakter

on:
  push:
    paths:
      - '.github/workflows/fix-service-contacts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Korrigera verifierade kontaktuppgifter
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/service-private-supplement.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          for item in data['businesses']:
              name = item.get('name')
              if name == 'Sunne El & VVS AB':
                  item['phone'] = '072-566 53 34'
              elif name == 'Henriks Elservice i Värmland AB':
                  item['phone'] = '070-456 85 82'
                  item.pop('url', None)
              elif name == 'Er Städhjälp':
                  item.pop('phone', None)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Spara korrigeringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/service-private-supplement.json
          if git diff --cached --quiet; then
            echo "Ingen ändring behövdes"
          else
            git commit -m "Korrigera verifierade servicekontakter"
            git push
          fi
