name: Uppdatera sportflöden

on:
  workflow_dispatch:
    inputs:
      verify_amal_only:
        description: "Läsande Åmålskontroll av lunch-OCR och IBK, utan dataändringar"
        type: boolean
        default: false
  pull_request:
    paths:
      - "scripts/sport-feed/**"
      - "data/sport-sources.json"
      - ".github/workflows/update-sport-feeds.yml"
  schedule:
    - cron: "17 4,10,16,22 * * *"

permissions:
  contents: write

concurrency:
  group: update-sport-feeds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ inputs.verify_amal_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Hämta repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera offentlig statistikklient för Åmål
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Hämta och normalisera matcher
        run: |
          PYTHONPATH=scripts python -m unittest scripts/test_amal_innebandy.py
          node scripts/sport-feed/update-sport-feeds.mjs

      - name: Kontrollera JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/sport-feeds.json','utf8')); console.log('sport-feeds.json är giltig JSON')"

      - name: Verifiera insamlingen
        run: |
          node - <<'NODE'
          const d = require('./data/sport-feeds.json');
          const failures = d.sources.filter(s => s.status !== 'ok');
          const matches = Object.values(d.municipalities).reduce((sum, item) => sum + (item.matches?.length || 0), 0);
          const standings = Object.values(d.municipalities).reduce((sum, item) => sum + (item.standings?.length || 0), 0);
          console.table(d.sources.map(s => ({id:s.id,status:s.status,matches:s.matchCount,standings:s.standingCount||0,message:s.message||''})));
          console.log(`Totalt ${matches} matcher och ${standings} tabeller.`);
          if (failures.length) console.warn(`${failures.length} källor kunde inte läsas; sidan använder officiella reservlänkar och behåller tidigare data.`);
          if (matches < 1) console.warn('Inga matcher kunde läsas in; föreningar och officiella källor visas fortfarande.');
          if (standings < 1) throw new Error('Ingen verifierad tabell kunde läsas in.');
          NODE

      - name: Spara uppdaterat sportflöde
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/sport-feeds.json; then
            echo "Ingen förändring i sportflödet."
            exit 0
          fi
          git config user.name "dinpuls-sport-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sport-feeds.json
          git commit -m "data: uppdatera officiella sportflöden"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

  verify-amal:
    if: ${{ inputs.verify_amal_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera ordinarie OCR och offentlig statistikklient
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
          python -m pip install "Pillow==11.3.0" "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Verifiera verkliga källor utan att skriva data
        run: python scripts/verify_amal_sources.py
