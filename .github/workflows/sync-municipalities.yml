name: Synkronisera kommunregister

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/municipalities.json"
      - "scripts/sync_municipality_scaffolds.py"

permissions:
  contents: write

concurrency:
  group: dinpuls-municipality-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synkronisera kommunscaffolds
        run: python scripts/sync_municipality_scaffolds.py

      - name: Verifiera centralt kommunregister
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          data = root / 'data'
          config = json.loads((data / 'municipalities.json').read_text(encoding='utf-8'))
          names = [item['name'] for item in config.get('municipalities', []) if item.get('name')]
          assert names, 'Kommunregistret är tomt'
          assert len(names) == len(set(names)), 'Kommunregistret innehåller dubbletter'

          engine = (root / 'municipality-engine.js').read_text(encoding='utf-8')
          for name in names:
              assert json.dumps(name, ensure_ascii=False) in engine, f'{name} saknas i municipality-engine.js'

          worker = (root / 'cloudflare' / 'push-worker.js').read_text(encoding='utf-8')
          assert 'import municipalityConfig from "../data/municipalities.json"' in worker, 'Workern läser inte centralt kommunregister'
          assert 'new Set(municipalityConfig.municipalities.map(item => item.name))' in worker, 'Workerns kommunvalidering är inte centraliserad'

          missing = []
          for path in sorted(data.glob('*.json')):
              payload = json.loads(path.read_text(encoding='utf-8'))
              municipalities = payload.get('municipalities') if isinstance(payload, dict) else None
              if not isinstance(municipalities, dict):
                  continue
              for name in names:
                  if name not in municipalities:
                      missing.append(f'{path.name}:{name}')
          assert not missing, 'Kommunscaffolds saknas: ' + ', '.join(missing)
          print(f'Verifierade central onboarding för {len(names)} kommuner')
          PY

      - name: Spara genererade kommunposter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add municipality-engine.js data/*.json
          if git diff --cached --quiet; then
            echo "Kommunscaffolds är redan synkroniserade."
            exit 0
          fi
          git commit -m "Synkronisera kommunscaffolds"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
