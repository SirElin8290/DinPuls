name: Uppdatera lediga jobb

on:
  workflow_dispatch:
  schedule:
    - cron: "42 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "data/municipalities.json"
      - "scripts/update_jobs.py"
      - ".github/workflows/update-jobs.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-jobs-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta lediga jobb
        run: python scripts/update_jobs.py

      - name: Verifiera att alla kommuner finns med
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          jobs = json.loads(Path('data/jobs.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          got = set(jobs.get('municipalities', {}))
          assert got == expected, f'Jobbkommuner avviker: expected={sorted(expected)}, got={sorted(got)}'
          print(f'Verifierade jobbdata för {len(expected)} kommuner')
          PY

      - name: Publicera jobbdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          if git diff --cached --quiet; then
            echo "Jobbdatan är redan aktuell."
            exit 0
          fi
          git commit -m "Uppdatera lediga jobb"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Lediga jobb publicerade."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "Kunde inte publicera jobbdata efter fyra försök." >&2
          exit 1
