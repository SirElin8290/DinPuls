name: Uppdatera dagens lunch

on:
  workflow_dispatch:
  push:
    paths:
      - "data/lunch-sources.json"
      - "data/municipalities.json"
      - "scripts/update_lunch.py"
      - "scripts/test_update_lunch.py"
      - ".github/workflows/update-lunch.yml"
  schedule:
    - cron: "35 4,7,9 * * 1-5"
    - cron: "35 7 * * 0,6"

permissions:
  contents: write

concurrency:
  group: dinpuls-lunch-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta restaurangernas veckomenyer
        run: |
          set -euo pipefail
          python scripts/test_update_lunch.py
          python scripts/update_lunch.py

      - name: Verifiera att alla kommuner finns med
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          lunch = json.loads(Path('data/lunch.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          got = set(lunch.get('municipalities', {}))
          assert got == expected, f'Lunchkommuner avviker: expected={sorted(expected)}, got={sorted(got)}'
          print(f'Verifierade lunchdata för {len(expected)} kommuner')
          PY

      - name: Publicera lunchdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lunch.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens lunch"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push-försök ${attempt} misslyckades, hämtar main igen"
            done
            echo "Kunde inte publicera lunchdata efter tre försök" >&2
            exit 1
          fi
