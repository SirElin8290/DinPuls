name: Uppdatera dagens lunch

on:
  workflow_dispatch:
  push:
    paths:
      - "data/lunch-sources.json"
      - "scripts/update_lunch.py"
      - ".github/workflows/update-lunch.yml"
  schedule:
    - cron: "35 4,8 * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-lunch-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta restaurangernas veckomenyer
        run: python scripts/update_lunch.py

      - name: Publicera lunchdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lunch.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens lunch"
            git pull --rebase
            git push
          fi
