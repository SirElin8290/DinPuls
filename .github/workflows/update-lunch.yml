name: Uppdatera dagens lunch

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "data/lunch-sources.json"
      - "data/lunch-exclusions.json"
      - "data/lunch-review.json"
      - "data/lunch-launch-supplement.json"
      - "data/lunch-hammaro-supplement.json"
      - "data/lunch-hagfors-supplement.json"
      - "data/lunch-fargelanda-supplement.json"
      - "data/lunch-storfors-supplement.json"
      - "data/lunch-torsby-supplement.json"
      - "data/karlstad-strict-source.json"
      - "data/municipalities.json"
      - "scripts/update_lunch.py"
      - "scripts/apply_fargelanda_lunch.py"
      - "scripts/apply_storfors_lunch.py"
      - "scripts/apply_karlstad_strict.py"
      - "scripts/test_update_lunch.py"
      - ".github/workflows/update-lunch.yml"
  schedule:
    - cron: "35 18 * * 0"
    - cron: "35 4,7,9 * * 1-5"
    - cron: "35 7 * * 0,6"

permissions:
  contents: write

concurrency:
  group: dinpuls-lunch-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera svensk OCR för bildmenyer
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
          python -m pip install "Pillow==11.3.0" "pypdf==6.1.1"

      - name: Hämta restaurangernas veckomenyer
        run: |
          set -euo pipefail
          python scripts/test_update_lunch.py
          python scripts/update_lunch.py

      - name: Verifiera att alla kommuner finns med och att lanseringskommunerna har matkälla
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          lunch = json.loads(Path('data/lunch.json').read_text(encoding='utf-8'))
          launch = json.loads(Path('data/lunch-launch-supplement.json').read_text(encoding='utf-8'))
          exclusions = json.loads(Path('data/lunch-exclusions.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          got = set(lunch.get('municipalities', {}))
          assert got == expected, f'Lunchkommuner avviker: expected={sorted(expected)}, got={sorted(got)}'
          for name in launch.get('municipalities', {}):
              entry = lunch['municipalities'][name]
              if name == 'Hammarö':
                  continue
              assert entry.get('restaurants') or entry.get('referenceSources'), f'{name}: saknar både lunchrestaurang och lokal matguide'
          restaurants = [item for row in lunch['municipalities'].values() for item in (row.get('restaurants') or [])]
          excluded_ids = {item['id'] for item in exclusions.get('excludedRestaurants', [])}
          assert len(restaurants) == lunch.get('curation', {}).get('menuCandidates'), 'Lunchkatalogens kandidatantal avviker'
          assert excluded_ids.isdisjoint({item.get('id') for item in restaurants}), 'Exkluderad katalogpost publicerades på nytt'
          assert lunch.get('curation', {}).get('excludedWithoutVerifiableMenu') == len(excluded_ids), 'Exkluderingsantalet avviker'
          karlstad = lunch['municipalities']['Karlstad']
          names = {item.get('name') for item in (karlstad.get('restaurants') or [])}
          assert {'Go Medda', "Joan's Karlstad", 'Nöjesfabriken'} == names, 'Karlstad: lunchkatalogen avviker från verifierade menykällor'
          assert any('karlstad.com/restauranger' in item.get('url','') for item in (karlstad.get('referenceSources') or [])), 'Karlstad: bred restaurangguide saknas'
          print(f"Verifierade lunchdata för {len(expected)} kommuner; Karlstad {len(karlstad.get('restaurants') or [])} restaurangkällor")
          PY

      - name: Publicera lunchdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lunch.json data/lunch-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens lunch"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
            done
            echo "Kunde inte publicera lunchdata efter fyra försök" >&2
            exit 1
          fi
