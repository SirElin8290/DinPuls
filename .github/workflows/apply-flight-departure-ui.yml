name: Applicera samlad avgångsmodul

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-flight-departure-ui.yml"
      - "scripts/apply_flight_departure_ui.py"

permissions:
  contents: write

concurrency:
  group: dinpuls-flight-departure-ui
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Applicera UI-ändringen
        run: python scripts/apply_flight_departure_ui.py
      - name: Verifiera samlad avgångsmodul
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('script.js').read_text(encoding='utf-8')
          transport = Path('components/transport.html').read_text(encoding='utf-8')
          primary = Path('components/primary-cards.html').read_text(encoding='utf-8')
          assert 'data-transport-mode="flight"' in transport
          assert 'async function loadFlights()' in script
          assert 'item.mode === "flight"' in script
          assert 'id="buss"' not in primary
          print('Verifierat: flygflik finns och duplicerad Buss & tåg-modul är borttagen')
          PY
      - name: Publicera ändringen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js components/transport.html components/primary-cards.html
          if git diff --cached --quiet; then
            echo "UI är redan applicerat."
            exit 0
          fi
          git commit -m "Samla avgångar och lägg till flyg"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
