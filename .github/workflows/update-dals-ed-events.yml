name: Uppdatera Dals-Ed evenemang

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4,10,16,22 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_dals_ed_events.py"
      - ".github/workflows/update-dals-ed-events.yml"

permissions:
  contents: write

concurrency:
  group: dals-ed-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synka mot senaste main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta Dals-Eds officiella evenemang
        run: python scripts/update_dals_ed_events.py
      - name: Verifiera Dals-Ed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/events.json').read_text(encoding='utf-8'))
          item = (data.get('municipalities') or {}).get('Dals-Ed') or {}
          events = item.get('events') or []
          if not events:
              raise SystemExit('Dals-Ed saknar evenemang efter kalenderimport')
          print(f'Dals-Ed: {len(events)} evenemang verifierade')
          PY
      - name: Publicera Dals-Eds evenemang
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/events.json; then
            echo "Dals-Eds evenemang är redan aktuella."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Uppdatera Dals-Eds evenemang"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
