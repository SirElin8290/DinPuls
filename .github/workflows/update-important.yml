name: Uppdatera dagens viktigaste

on:
  workflow_dispatch:
  push:
    paths:
      - "data/municipalities.json"
      - "scripts/update_important.py"
      - "data/important-sources.json"
      - ".github/workflows/update-important.yml"
  schedule:
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-important
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta officiella händelser
        run: python scripts/update_important.py

      - name: Spara dagens viktigaste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/important.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera dagens viktigaste"
            for attempt in 1 2 3; do
              git pull --rebase && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 2))
            done
            exit 1
          fi
