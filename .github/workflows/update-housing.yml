name: Uppdatera lediga bostäder

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */4 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_housing.py"
      - "scripts/update_housing_sunne.py"
      - "scripts/test_update_housing.py"
      - "data/municipalities.json"
      - ".github/workflows/update-housing.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-housing-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta aktuella bostäder
        run: |
          python scripts/update_housing.py
          python scripts/update_housing_sunne.py

      - name: Verifiera Sunne-data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/housing.json').read_text(encoding='utf-8'))
          sunne = data.get('municipalities', {}).get('Sunne', {})
          assert sunne.get('total', 0) > 0, 'Sunne saknar bostadsobjekt efter hämtning'
          assert len(sunne.get('listings', [])) == sunne.get('total'), 'Sunnes total matchar inte listan'
          assert sunne.get('stale') is False, 'Sunne-data är markerad stale'
          assert not sunne.get('errors'), f"Sunne har källfel: {sunne.get('errors')}"
          for item in sunne.get('listings', []):
              assert item.get('address'), 'Sunne-objekt saknar adress'
              assert item.get('url'), 'Sunne-objekt saknar länk'
              assert item.get('provider') == 'Sunne Fastighets AB'
          print(f"Verifierat: Sunne har {sunne['total']} aktuella bostadsobjekt")
          PY

      - name: Testa bostadslogiken
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_housing.py

      - name: Spara ny bostadsdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera lediga bostäder"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Nya bostadsuppgifter publicerade."
                exit 0
              fi
              git rebase --abort || true
              echo "Push-försök $attempt misslyckades; hämtar senaste main."
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
            done
            exit 1
          fi
