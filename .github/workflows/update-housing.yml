name: Uppdatera lediga bostäder

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "43 */4 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/validate_housing_publication.py"
      - "scripts/update_housing.py"
      - "scripts/update_housing_sunne.py"
      - "scripts/update_housing_eda.py"
      - "scripts/update_housing_launch.py"
      - "scripts/update_housing_forshaga.py"
      - "scripts/update_housing_fargelanda.py"
      - "scripts/update_housing_storfors.py"
      - "scripts/test_update_housing.py"
      - "scripts/test_dals_ed_imports.py"
      - "scripts/test_update_housing_launch.py"
      - "scripts/test_update_housing_forshaga.py"
      - "scripts/update_housing_coverage_evidence.py"
      - "data/housing-launch-sources.json"
      - "data/housing-coverage-sources.json"
      - "data/municipalities.json"
      - ".github/workflows/update-housing.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-housing-data
  cancel-in-progress: false

jobs:
  block3-fallback:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=scripts python -m unittest scripts/test_update_housing.py scripts/test_update_housing_launch.py
      - name: Publicera Block 3 oberoende av andra bostadskällor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_housing.py --municipality Säffle
          python scripts/update_housing.py --municipality Munkfors
          python scripts/update_housing.py --municipality Torsby
          python scripts/update_housing_coverage_evidence.py
          git add data/housing.json data/housing-coverage-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera Block 3-bostäder oberoende av övriga källor"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_housing.py --municipality Säffle
            python scripts/update_housing.py --municipality Munkfors
            python scripts/update_housing.py --municipality Torsby
            python scripts/update_housing_coverage_evidence.py
            git add data/housing.json data/housing-coverage-evidence.json
            git diff --cached --quiet && exit 0
            git commit -m "Uppdatera Block 3-bostäder oberoende av övriga källor"
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1

  block2-fallback:
    needs: [update, edshus-fallback]
    if: always() && needs.update.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=scripts python -m unittest scripts/test_update_housing.py scripts/test_update_housing_launch.py
      - name: Publicera Block 2 oberoende av andra bostadskällor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_housing.py --municipality Grums
          python scripts/update_housing.py --municipality Filipstad
          python scripts/update_housing.py --municipality Bengtsfors
          python scripts/update_housing_coverage_evidence.py
          git add data/housing.json data/housing-coverage-evidence.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera Block 2-bostäder oberoende av övriga källor"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1

  edshus-fallback:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=scripts python -m unittest scripts/test_dals_ed_imports.py
      - name: Publicera endast verifierade Edshus-objekt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_housing_launch.py --municipality Dals-Ed
          git add data/housing.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera Edshus oberoende av övriga bostadskällor"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta bostäder – update_housing
        continue-on-error: true
        run: python scripts/update_housing.py

      - name: Hämta bostäder – update_housing_sunne
        continue-on-error: true
        run: python scripts/update_housing_sunne.py

      - name: Hämta bostäder – update_housing_eda
        continue-on-error: true
        run: python scripts/update_housing_eda.py

      - name: Hämta bostäder – update_housing_launch
        continue-on-error: true
        run: python scripts/update_housing_launch.py

      - name: Hämta bostäder – update_housing_forshaga
        continue-on-error: true
        run: python scripts/update_housing_forshaga.py

      - name: Hämta bostäder – update_housing_fargelanda
        continue-on-error: true
        run: python scripts/update_housing_fargelanda.py

      - name: Hämta bostäder – update_housing_storfors
        continue-on-error: true
        run: python scripts/update_housing_storfors.py

      - name: Kontrollera alla kommuner och särredovisa källfel
        run: python scripts/validate_housing_publication.py

      - name: Uppdatera källevidens
        run: python scripts/update_housing_coverage_evidence.py

      - name: Testa bostadslogiken
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_housing.py scripts/test_update_housing_launch.py scripts/test_update_housing_forshaga.py scripts/test_dals_ed_imports.py scripts/test_publication_resilience.py

      - name: Spara ny bostadsdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json data/housing-coverage-evidence.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera lediga bostäder"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Nya bostadsuppgifter publicerade."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push-försök $attempt misslyckades; hämtar senaste main."
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
            done
            exit 1
          fi
