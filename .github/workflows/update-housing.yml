name: Uppdatera lediga bostäder

on:
  workflow_dispatch:
  schedule:
    - cron: "43 */4 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_housing.py"
      - "scripts/update_housing_sunne.py"
      - "scripts/update_housing_eda.py"
      - "scripts/update_housing_launch.py"
      - "scripts/test_update_housing.py"
      - "scripts/test_dals_ed_imports.py"
      - "scripts/test_update_housing_launch.py"
      - "data/housing-launch-sources.json"
      - "data/municipalities.json"
      - ".github/workflows/update-housing.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-housing-data
  cancel-in-progress: false

jobs:
  edshus-fallback:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: PYTHONPATH=scripts python -m unittest scripts/test_dals_ed_imports.py
      - name: Publicera endast verifierade Edshus-objekt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/update_housing_launch.py --municipality Dals-Ed
          git add data/housing.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera Edshus oberoende av övriga bostadskällor"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta aktuella bostäder
        run: |
          set -euo pipefail
          python scripts/update_housing.py
          python scripts/update_housing_sunne.py
          python scripts/update_housing_eda.py
          python scripts/update_housing_launch.py

      - name: Verifiera kommunregistret och bostadskällornas hälsa
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          data = json.loads(Path('data/housing.json').read_text(encoding='utf-8'))
          launch = json.loads(Path('data/housing-launch-sources.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          actual = set((data.get('municipalities') or {}).keys())
          assert actual == expected, f'Bostadskommuner saknas/fel: expected={sorted(expected)}, got={sorted(actual)}'

          launch_names = set((launch.get('municipalities') or {}).keys())
          for item in config.get('municipalities', []):
              name = item['name']
              municipality = data['municipalities'][name]
              assert isinstance(municipality.get('listings'), list), f'{name} saknar bostadslista'
              if name in launch_names:
                  health = municipality.get('sourceHealth') or []
                  assert health and all(row.get('status') == 'ok' for row in health), f'{name}: bostadskällan är inte frisk: {health}'
                  mode = municipality.get('availabilityMode')
                  assert mode in {'automatic', 'official-reference'}, f'{name}: okänt availabilityMode {mode!r}'
                  if mode == 'automatic':
                      assert isinstance(municipality.get('total'), int), f'{name}: automatic saknar numerisk total'
                      assert municipality.get('total') == len(municipality['listings']), f'{name}: total matchar inte listan'
                  else:
                      assert municipality.get('total') is None, f'{name}: official-reference får inte visa falsk total'
                  assert municipality.get('stale') is False, f'{name}: bostadsdata markerad stale'
                  assert not municipality.get('errors'), f'{name}: bostadskällfel {municipality.get("errors")}'
              else:
                  assert municipality.get('total') == len(municipality['listings']), f'{name}: total matchar inte listan'
          print(f'Bostadsdata innehåller alla {len(expected)} kommuner; {len(launch_names)} lanseringskällor är friska')
          PY

      - name: Verifiera Sunne-data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/housing.json').read_text(encoding='utf-8'))
          sunne = data.get('municipalities', {}).get('Sunne', {})
          assert sunne.get('total', 0) > 0, 'Sunne saknar bostadsobjekt efter hämtning'
          assert len(sunne.get('listings', [])) == sunne.get('total'), 'Sunnes total matchar inte listan'
          assert sunne.get('stale') is False, 'Sunne-data är markerad stale'
          assert not sunne.get('errors'), f"Sunne har källfel: {sunne.get('errors')}"
          print(f"Verifierat: Sunne har {sunne['total']} aktuella bostadsobjekt")
          PY

      - name: Verifiera Eda-data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/housing.json').read_text(encoding='utf-8'))
          eda = data.get('municipalities', {}).get('Eda', {})
          assert eda.get('total', 0) > 0, 'Eda saknar bostadsobjekt efter hämtning'
          assert len(eda.get('listings', [])) == eda.get('total'), 'Edas total matchar inte listan'
          assert eda.get('stale') is False, 'Eda-data är markerad stale'
          for item in eda.get('listings', []):
              assert item.get('id'), 'Eda-objekt saknar objektnummer'
              assert item.get('address'), 'Eda-objekt saknar adress'
              assert item.get('url'), 'Eda-objekt saknar länk'
              assert item.get('provider') == 'Eda Bostads AB'
          print(f"Verifierat: Eda har {eda['total']} aktuella bostadsobjekt")
          PY

      - name: Testa bostadslogiken
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_housing.py scripts/test_update_housing_launch.py scripts/test_dals_ed_imports.py

      - name: Spara ny bostadsdata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera lediga bostäder"
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "Nya bostadsuppgifter publicerade."
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              echo "Push-försök $attempt misslyckades; hämtar senaste main."
              [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
            done
            exit 1
          fi
