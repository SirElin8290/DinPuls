name: Uppdatera tank- och laddstationer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-fuel-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta stationer och verifierade priser
        run: python scripts/update_fuel.py
      - name: Spara ny stationsdata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fuel.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera tank- och laddstationer"
            git pull --rebase
            git push
          fi
