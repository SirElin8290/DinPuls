name: Verifiera Åmåls automatiska källor
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installera ordinarie OCR och offentlig statistikklient
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-swe
          python -m pip install "Pillow==11.3.0" "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Verifiera verkliga källor utan att skriva data
        run: python scripts/verify_amal_sources.py
