name: Bygg DinPuls testapp
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, ios, android]
        description: Plattform att bygga och verifiera
  push:
    branches: ['app/**']
    paths: ['app/**', '.github/workflows/build-mobile-app.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DINPULS_VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix .. ci --no-audit --no-fund
      - name: Installera Androids Firebase-konfiguration
        env:
          FIREBASE_CONFIG: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$FIREBASE_CONFIG"
          printf '%s' "$FIREBASE_CONFIG" > android/app/google-services.json
      - run: npm run build && npm test && npx cap sync android
      - name: Bygg installerbar test-APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-Android-testapp
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
      - name: Aktivera emulatoracceleration
        run: sudo chmod 666 /dev/kvm
      - name: Bygg isolerad testvariant utan riktiga köp eller mejl
        run: |
          cp capacitor.config.json "$RUNNER_TEMP/capacitor-production.json"
          trap 'cp "$RUNNER_TEMP/capacitor-production.json" capacitor.config.json' EXIT
          node --input-type=module -e "import fs from 'node:fs';const p='capacitor.config.json';const c=JSON.parse(fs.readFileSync(p));c.android.allowMixedContent=true;fs.writeFileSync(p,JSON.stringify(c));"
          DINPULS_ISOLATED_E2E=1 npm run build
          npx cap sync android
      - name: Testa appstart, live-data, kommunval och navigation på Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash app/scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DinPuls-Android-mobilkontroll
          path: |
            app/android/app-screenshots
            app/android/app/build/reports/androidTests
          retention-days: 3
      - name: Bygg permanent signerad APK och AAB utan isolerad testkod
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          export ANDROID_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/dinpuls-release.p12"
          trap 'rm -f "$ANDROID_RELEASE_KEYSTORE_PATH"' EXIT
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE_PATH"
          chmod 600 "$ANDROID_RELEASE_KEYSTORE_PATH"
          npm run build && npx cap sync android
          cd android && ./gradlew assembleRelease bundleRelease --no-daemon
          "$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)" verify --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-Android-AAB-SIGNERAD
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-Android-releaseapp
          path: app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
  ios:
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix .. ci --no-audit --no-fund
      - run: npm run build && npm test && npx cap sync ios
      - name: Förbered iOS och eventuell Firebase-konfiguration
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: node scripts/prepare-ios.mjs
      - name: Bygg utan betalt konto för iPhone-simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
      - name: Paketera simulatorapp
        run: ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/App.app DinPuls-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-iOS-simulator
          path: app/DinPuls-iOS-simulator.zip
          retention-days: 3
          if-no-files-found: error
      - name: Bygg isolerad iPhone-testvariant
        run: |
          DINPULS_ISOLATED_E2E=1 npm run build
          npx cap sync ios
          DINPULS_IOS_CI=1 node scripts/prepare-ios.mjs
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity dict' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true' ios/App/App/Info.plist
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios-ci CODE_SIGNING_ALLOWED=NO build
      - name: Kör isolerad kedja i riktig iPhone-simulator
        run: bash scripts/ios-simulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DinPuls-iOS-mobilkontroll
          path: app/ios-qa
          retention-days: 7
