name: Bygg DinPuls testapp
on:
  push:
    branches: ['app/**']
    paths: ['app/**', '.github/workflows/build-mobile-app.yml']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test && npx cap sync android
      - name: Bygg installerbar test-APK
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-Android-testapp
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
          if-no-files-found: error
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test && npx cap sync ios
      - name: Bygg utan betalt konto för iPhone-simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
      - name: Paketera simulatorapp
        run: ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/App.app DinPuls-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DinPuls-iOS-simulator
          path: app/DinPuls-iOS-simulator.zip
          retention-days: 3
          if-no-files-found: error
