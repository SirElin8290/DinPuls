# Push på eventrelaterade filer triggar alltid en färsk regenerering på main.
name: Uppdatera evenemang

on:
  workflow_dispatch:
  schedule:
    - cron: "42 4,10,16,22 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_events.py"
      - "scripts/update_dals_ed_events.py"
      - "scripts/test_update_events.py"
      - "scripts/test_dals_ed_imports.py"
      - "data/event-sources.json"
      - "data/municipalities.json"
      - ".github/workflows/update-events.yml"

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontrollera lokala evenemangskällor
        run: python scripts/update_events.py
      - name: Hämta Dals-Eds officiella kalender
        run: python scripts/update_dals_ed_events.py
      - name: Testa evenemangslogiken
        run: PYTHONPATH=scripts python -m unittest scripts/test_update_events.py scripts/test_dals_ed_imports.py
      - name: Verifiera alla kommuner i evenemangsdatan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          events = json.loads(Path('data/events.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          actual = set((events.get('municipalities') or {}).keys())
          if actual != expected:
              raise SystemExit(f'Evenemangskommuner avviker: expected={sorted(expected)}, got={sorted(actual)}')
          dals_ed = (events.get('municipalities') or {}).get('Dals-Ed') or {}
          if not any(source.get('status') == 'ok' and source.get('mode') == 'automatic' for source in dals_ed.get('sourceHealth', [])):
              raise SystemExit('Dals-Ed saknar verifierad kalenderstatus')
          print(f'Evenemangsdata innehåller alla {len(expected)} kommuner; Dals-Ed har {len(dals_ed["events"])} poster')
          PY
      - name: Spara evenemangsdata konfliktsäkert
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/events.json; then
            echo "Inga evenemangsförändringar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "Uppdatera evenemang"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Nya evenemang publicerade."
              exit 0
            fi
            git rebase --abort || true
            echo "Push-försök $attempt misslyckades; hämtar senaste main."
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          exit 1
