name: Fixa Stallbacka-parser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-stallbacka-parser.yml"
      - "scripts/fix_stallbacka_parser.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Applicera parserfix
        run: python scripts/fix_stallbacka_parser.py
      - name: Verifiera parserfix
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('scripts/update_flights.py').read_text(encoding='utf-8')
          assert 'departure_labels = {"avgångar", "departures"}' in text
          assert 'Stallbackas liveavgångar kunde inte tolkas; kandidater=' in text
          print('Verifierat: robust Stallbacka-parser finns')
          PY
      - name: Publicera parserfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/update_flights.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Gör Stallbackas flygparser robust"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
