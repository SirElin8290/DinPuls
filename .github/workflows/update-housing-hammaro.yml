name: Uppdatera Hammarö bostäder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/housing-hammaro-supplement.json"
      - "scripts/apply_hammaro_housing.py"
      - ".github/workflows/update-housing-hammaro.yml"

permissions:
  contents: write

concurrency:
  group: dinpuls-hammaro-housing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Applicera verifierad Hammarö-data
        run: python scripts/apply_hammaro_housing.py

      - name: Verifiera Hammarö
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('data/housing.json').read_text(encoding='utf-8'))['municipalities']['Hammarö']
          listings = row.get('listings') or []
          assert len(listings) >= 1, 'Hammarö saknar verifierat bostadsobjekt'
          assert row.get('total') == len(listings)
          assert row.get('availabilityMode') == 'automatic'
          assert row.get('stale') is False
          assert not row.get('errors')
          assert all(item.get('address') and item.get('url') for item in listings)
          print(f"Hammarö: {len(listings)} verifierade bostadsobjekt")
          PY

      - name: Publicera Hammarö bostäder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/housing.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera Hammarö bostäder"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
