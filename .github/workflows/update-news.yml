name: Uppdatera nyheter

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/update_news.py"
      - "scripts/test_filipstad_imports.py"
      - "scripts/update_news_deep.py"
      - "scripts/sanitize_news_freshness.py"
      - "data/municipalities.json"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Installera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta aktuella nyheter
        run: python scripts/update_news.py
      - name: Gör ett andra hämtningsförsök vid tillfälliga källfel
        run: python scripts/update_news.py
      - name: Djupsök färska lokala nyheter i alla kommuner
        run: python scripts/update_news_deep.py
      - name: Sanera falskt färska kommunnyheter
        run: python scripts/sanitize_news_freshness.py
      - name: Testa nyhetslogiken
        run: PYTHONPATH=scripts python -m unittest scripts/test_filipstad_imports.py scripts/test_update_news.py
      - name: Spara nyhetsdata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/news.json; then
            echo "Inga nyhetsförändringar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Uppdatera nyheter"
          for attempt in 1 2 3 4; do
            echo "Publiceringsförsök $attempt av 4"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Nya lokala nyheter publicerade."
              exit 0
            fi
            git rebase --abort || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 2))
          done
          echo "Kunde inte publicera nyheterna efter fyra försök."
          exit 1
