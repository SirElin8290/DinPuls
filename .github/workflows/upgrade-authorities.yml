name: Uppgradera myndighetsguiden

on:
  push:
    paths:
      - '.github/workflows/upgrade-authorities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bygg ut myndighetsguiden
        run: python scripts/upgrade_authorities.py
      - name: Spara ändringen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/authorities.json myndigheter-page.js myndigheter.html scripts/test_authorities.py
          git commit -m "Bygg ut Myndigheter och samhällsservice"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
