name: Uppdatera liveinformation

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta kollektivtrafik
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
        run: python scripts/update_transport.py

      - name: Hämta vägtrafik
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
        run: python scripts/update_road_traffic.py

      - name: Hämta dagens viktigaste
        run: python scripts/update_important.py

      - name: Publicera liveinformation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transport.json data/road-traffic.json data/important.json
          if ! git diff --cached --quiet; then
            git commit -m "Uppdatera liveinformation"
            git pull --rebase
            git push
          fi
