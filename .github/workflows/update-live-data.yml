name: Uppdatera vägtrafik

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-live-data.yml"
      - "scripts/update_road_traffic.py"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-road-traffic
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Hämta vägtrafik
        env:
          TRAFIKVERKET_API_KEY: ${{ secrets.TRAFIKVERKET_API_KEY }}
        run: python scripts/update_road_traffic.py

      - name: Publicera vägtrafik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/road-traffic.json
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera vägtrafik"
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "Kunde inte publicera vägtrafiken efter tre försök" >&2
          exit 1
