name: DinPuls nattkontroll och källuppdatering
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
      timezone: Europe/Stockholm
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: dinpuls-nightly-sources
  cancel-in-progress: false
jobs:
  news:
    uses: ./.github/workflows/update-news.yml
  events:
    needs: news
    if: ${{ always() }}
    uses: ./.github/workflows/update-events.yml
  lunch:
    needs: events
    if: ${{ always() }}
    uses: ./.github/workflows/update-lunch.yml
  school:
    needs: lunch
    if: ${{ always() }}
    uses: ./.github/workflows/update-school-meals.yml
  associations:
    needs: school
    if: ${{ always() }}
    uses: ./.github/workflows/update-associations.yml
  news_retry:
    needs: [news, events, lunch, school, associations]
    if: ${{ always() && (needs.news.result == 'failure' || needs.news.result == 'cancelled') }}
    uses: ./.github/workflows/update-news.yml
  events_retry:
    needs: [news, events, lunch, school, associations]
    if: ${{ always() && (needs.events.result == 'failure' || needs.events.result == 'cancelled') }}
    uses: ./.github/workflows/update-events.yml
  lunch_retry:
    needs: [news, events, lunch, school, associations]
    if: ${{ always() && (needs.lunch.result == 'failure' || needs.lunch.result == 'cancelled') }}
    uses: ./.github/workflows/update-lunch.yml
  school_retry:
    needs: [news, events, lunch, school, associations]
    if: ${{ always() && (needs.school.result == 'failure' || needs.school.result == 'cancelled') }}
    uses: ./.github/workflows/update-school-meals.yml
  associations_retry:
    needs: [news, events, lunch, school, associations]
    if: ${{ always() && (needs.associations.result == 'failure' || needs.associations.result == 'cancelled') }}
    uses: ./.github/workflows/update-associations.yml
  check:
    needs: [news, events, lunch, school, associations, news_retry, events_retry, lunch_retry, school_retry, associations_retry]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testa källkontrollen
        run: PYTHONPATH=scripts python -m unittest scripts/test_public_sources.py
      - name: Kontrollera aktuella offentliga källor
        run: python scripts/check_public_sources.py
      - name: Lägg till uppdateringsresultat
        env:
          UPDATE_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('data/source-monitor.json')
          report = json.loads(path.read_text())
          report['runUrl'] = os.environ['RUN_URL']
          results = json.loads(os.environ['UPDATE_RESULTS'])
          report['updateAttempts'] = {name: row['result'] for name, row in results.items()}
          report['updates'] = {name: ('success' if row['result'] == 'success' or results.get(name + '_retry', {}).get('result') == 'success' else row['result']) for name, row in results.items() if not name.endswith('_retry')}
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          with Path('docs/SOURCE-MONITOR-LATEST.md').open('a') as out:
              out.write('\n## Automatiska uppdateringar\n\n' + '\n'.join(f'- {name}: {status}' for name, status in report['updates'].items()) + '\n')
          PY
      - name: Publicera källstatus och rapport
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source-monitor.json docs/SOURCE-MONITOR-LATEST.md
          git commit -m 'Publicera DinPuls nattliga källkontroll'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            [ "$attempt" -lt 4 ] && sleep $((attempt * 3))
          done
          exit 1
      - name: Säkerställ Pages-publicering
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Spara rapport som körningsbilaga
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-source-monitor
          path: |
            data/source-monitor.json
            docs/SOURCE-MONITOR-LATEST.md
      - name: Visa morgonrapport
        if: ${{ always() }}
        run: |
          if [ -f docs/SOURCE-MONITOR-LATEST.md ]; then
            head -c 800000 docs/SOURCE-MONITOR-LATEST.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Nattkontrollen misslyckades innan rapporten kunde skapas.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Markera misslyckade uppdateringar
        run: |
          python - <<'PY'
          import json
          report = json.load(open('data/source-monitor.json'))
          failed = [key for key, status in report.get('updates', {}).items() if status != 'success']
          if failed:
              raise SystemExit('Uppdatering misslyckades: ' + ', '.join(failed) + '. Källrapporten är ändå sparad.')
          PY

  ui_quality:
    needs: check
    if: ${{ always() }}
    uses: ./.github/workflows/ui-quality.yml
