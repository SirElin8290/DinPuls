name: Applicera jobbstämpel för senaste kontroll

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-jobs-checked-ui.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Applicera ändringen
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old_expr = 'municipalityData.updatedAt || jobsData.generatedAt'
          new_expr = 'municipalityData.checkedAt || jobsData.generatedAt || municipalityData.updatedAt'
          old_label = '`Uppdaterad ${timestamp.toLocaleString'
          new_label = '`Kontrollerad ${timestamp.toLocaleString'
          if new_expr not in text:
              if old_expr not in text:
                  raise SystemExit('Kunde inte hitta jobbmodulens tidsuttryck')
              text = text.replace(old_expr, new_expr, 1)
          if new_label not in text:
              if old_label not in text:
                  raise SystemExit('Kunde inte hitta jobbmodulens tidslabel')
              text = text.replace(old_label, new_label, 1)
          path.write_text(text, encoding='utf-8')
          print('Jobbmodulen visar nu senaste faktiska kontrolltid')
          PY
      - name: Verifiera ändringen
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('script.js').read_text(encoding='utf-8')
          assert 'municipalityData.checkedAt || jobsData.generatedAt || municipalityData.updatedAt' in text
          assert '`Kontrollerad ${timestamp.toLocaleString' in text
          print('Verifierat: jobbmodulen visar senaste faktiska kontroll')
          PY
      - name: Publicera ändringen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Visa senaste kontrolltid för lediga jobb"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
