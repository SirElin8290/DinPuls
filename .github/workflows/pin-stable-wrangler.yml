name: Lås stabil Wrangler

on:
  push:
    paths:
      - '.github/workflows/pin-stable-wrangler.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktivera Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lås Wrangler 4.118.0
        run: npm install --save-dev --save-exact wrangler@4.118.0

      - name: Spara låsningen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Ingen ändring behövdes"
          else
            git commit -m "Lås Wrangler till stabil Miniflare"
            git push
          fi
