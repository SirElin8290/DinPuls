name: Uppdatera väderläget

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-weather-live.yml"
      - "scripts/update_weather_live.py"
      - "data/municipalities.json"
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_run:
    workflows:
      - "Uppdatera kollektivtrafik"
      - "Uppdatera dagens lunch"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: dinpuls-weather-live
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synka mot senaste main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testa väderinsamlingen
        run: PYTHONPATH=scripts python scripts/test_update_weather_live.py

      - name: Hämta väderläge
        env:
          XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
          XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
        run: python scripts/update_weather_live.py

      - name: Verifiera kommunregistret i väderdatan
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path('data/municipalities.json').read_text(encoding='utf-8'))
          data = json.loads(Path('data/weather-live.json').read_text(encoding='utf-8'))
          expected = {item['name'] for item in config.get('municipalities', []) if item.get('name')}
          actual = set((data.get('municipalities') or {}).keys())
          assert actual == expected, f'Väderkommuner saknas/fel: expected={sorted(expected)}, got={sorted(actual)}'
          for item in config.get('municipalities', []):
              name = item['name']
              weather = data['municipalities'][name]
              coordinates = weather.get('coordinates') or {}
              assert float(coordinates.get('latitude')) == float(item['latitude']), f'{name}: fel latitud'
              assert float(coordinates.get('longitude')) == float(item['longitude']), f'{name}: fel longitud'
          print(f'Vederdata innehåller alla {len(expected)} kommuner')
          PY

      - name: Publicera väderläge konfliktsäkert
        shell: bash
        env:
          XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
          XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Publiceringsförsök $attempt av 4"
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_weather_live.py
            git add data/weather-live.json
            if git diff --cached --quiet; then
              echo "Väderfilen är redan aktuell."
              exit 0
            fi
            git commit -m "Uppdatera väderläget"
            if git push origin HEAD:main; then
              echo "Nytt väderläge publicerat."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 2))
            fi
          done
          echo "Kunde inte publicera väderläget efter fyra försök" >&2
          exit 1
