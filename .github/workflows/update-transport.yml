name: Uppdatera kollektivtrafik

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-transport.yml"
      - "scripts/update_transport.py"
      - "data/municipalities.json"
  schedule:
    # Undvik hel- och kvartstimmar då GitHubs schemakö är som mest belastad.
    - cron: "4,19,34,49 * * * *"

permissions:
  contents: write

concurrency:
  group: dinpuls-transport-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hämta projektet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aktivera Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta aktuella avgångar
        env:
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
        run: python scripts/update_transport.py

      - name: Verifiera färsk transportdata
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("data/transport.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          generated = datetime.fromisoformat(str(data.get("generatedAt", "")).replace("Z", "+00:00"))
          age = datetime.now(timezone.utc) - generated.astimezone(timezone.utc)
          municipalities = data.get("municipalities") or {}
          stops = sum(len((entry or {}).get("stops") or []) for entry in municipalities.values())

          if age.total_seconds() < 0 or age.total_seconds() > 300:
              raise SystemExit(f"Transportfilen är inte färsk: {age.total_seconds():.0f} sekunder gammal")
          if data.get("source") != "Trafiklab":
              raise SystemExit("Transportfilen saknar Trafiklab som källa")
          if not municipalities or stops == 0:
              raise SystemExit("Transportfilen saknar kommuner eller hållplatser")

          print(f"Transportdata verifierad: {len(municipalities)} kommuner, {stops} hållplatser, {age.total_seconds():.0f} sekunder gammal")
          PY

      - name: Spara ny trafikdata konfliktsäkert
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/transport.json

          if git diff --cached --quiet; then
            echo "Transportfilen är redan aktuell."
            exit 0
          fi

          git commit -m "Uppdatera buss- och tågtider"

          for attempt in 1 2 3 4; do
            echo "Publiceringsförsök $attempt av 4"
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Nya avgångar publicerade."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true

            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Kunde inte publicera efter fyra försök."
          exit 1
