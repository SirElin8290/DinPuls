<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Företagsportal · DinPuls</title>
  <link rel="icon" href="../assets/favicon-32x32.png">
  <link rel="preload" as="image" href="../assets/business-entry-autumn.webp" fetchpriority="high">
  <link rel="stylesheet" href="start.css?v=3">
</head>
<body>
  <main class="business-entry">
    <img class="hero-image" src="../assets/business-entry-autumn.webp" alt="Höstkväll i en levande svensk småstad med café, lokala butiker och en laptop med DinPuls" fetchpriority="high">
    <div class="hero-overlay" aria-hidden="true"></div>
    <header class="top"><a href="../" class="brand"><picture><source media="(max-width: 760px)" srcset="../assets/logo-mobile.svg?version=0.23.4"><img class="brand-logo" src="../assets/logo.svg?version=0.23.4" alt="DinPuls.se – din lokala startsida" width="620" height="150"></picture></a><a href="../">Till startsidan</a></header>
    <section class="entry-layout" aria-label="DinPuls företagsportal">
      <div class="identity"><p>DINPULS FÖR FÖRETAG</p><h1>Lokala företag stärker lokala liv</h1></div>
      <div id="authCard" class="auth-card">
        <div class="auth-card-inner">
          <section id="loginPanel" class="card-face card-front" aria-labelledby="loginTitle">
            <p class="eyebrow">FÖRETAGSPORTAL</p><h2 id="loginTitle">Logga in</h2>
            <form id="companyEntryLogin">
              <label for="loginEmail">E-post</label><input id="loginEmail" name="email" type="email" autocomplete="username" required>
              <label for="loginPassword">Lösenord</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
              <a class="forgot" href="konto.html">Glömt lösenord?</a>
              <button class="button primary" type="submit">Logga in <span aria-hidden="true">→</span></button>
              <p id="entryLoginMessage" class="form-message" role="alert" hidden></p>
            </form>
            <div class="new-customer"><span>Inte kund ännu?</span><a id="showRegistration" class="button secondary" href="registrera.html">Skapa företagskonto</a></div>
          </section>
          <section id="registrationPanel" class="card-face card-back" aria-labelledby="registrationTitle" aria-hidden="true" inert>
            <p class="eyebrow">FÖRETAGSPORTAL</p><h2 id="registrationTitle">Skapa företagskonto</h2>
            <p id="registrationUnavailable" class="form-message" role="status">Kontrollerar om självregistrering är öppen…</p>
            <form id="registrationForm" hidden>
              <div class="registration-grid">
                <label for="orgNo">Organisationsnummer</label><input id="orgNo" name="orgNo" inputmode="numeric" autocomplete="off" placeholder="556123-4567" required>
                <label for="company">Företagsnamn</label><input id="company" name="company" autocomplete="organization" required>
                <label for="address">Adress</label><input id="address" name="address" autocomplete="street-address" required>
                <label for="postalCode">Postnummer</label><input id="postalCode" name="postalCode" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{3} ?[0-9]{2}" required>
                <label for="city">Ort</label><input id="city" name="city" autocomplete="address-level2" required>
                <label for="contact">Kontaktperson</label><input id="contact" name="contact" autocomplete="name" required>
                <label for="phone">Telefon</label><input id="phone" name="phone" type="tel" autocomplete="tel" required>
                <label for="registerEmail">E-post för inloggning</label><input id="registerEmail" name="email" type="email" autocomplete="email" required>
              </div>
              <p class="registration-hint">Organisationsnumret kontrolleras formellt.</p>
              <button class="button primary register-button" type="submit">Skapa konto och skicka aktiveringslänk</button>
              <p id="registrationResult" class="form-message" role="status" hidden></p>
            </form>
            <button id="showLogin" class="back-button" type="button">← Jag har redan ett konto</button>
          </section>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="start.js?v=2"></script>
</body>
</html>
