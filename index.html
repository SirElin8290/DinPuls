<!doctype html>
<html lang="sv" data-version="0.23.4">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DinPuls.se – din lokala startsida.">
  <meta name="theme-color" content="#082653">
  <meta name="dinpuls-version" content="0.23.4">
  <title>DinPuls.se – din lokala startsida</title>
  <link rel="stylesheet" href="styles.css?version=0.23.4-module-order-1">
  <link rel="icon" href="favicon.ico?version=0.23.4" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/compass-mark.svg?version=0.23.4">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png?version=0.23.4">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?version=0.23.4">
  <link rel="manifest" href="site.webmanifest?version=0.23.4">
</head>
<body>
  <div data-component="header"></div>
  <div data-component="homepage-guide"></div>
  <div data-component="google-search"></div>
  <div data-component="quick-strip"></div>
  <div data-component="navigation"></div>
  <div data-component="lunch-strip"></div>

  <main>
    <div data-component="hero"></div>
    <div data-component="secondary-cards"></div>
    <div data-component="primary-cards"></div>
    <div data-component="transport"></div>
    <div data-component="premium-ad-1"></div>
    <div data-component="jobs-housing"></div>
    <div data-component="premium-ad-2"></div>
    <div data-component="health"></div>
    <div data-component="sport"></div>
    <div data-component="cinema"></div>
    <div data-component="service"></div>
    <div data-component="authorities"></div>
    <section class="news-sources-section" id="news-sources">
      <div class="section-heading">
        <div>
          <span class="section-kicker">Öppen och tydlig källhantering</span>
          <h2>Nyhetskällor för <span data-municipality-name>Åmål</span></h2>
        </div>
        <p>DinPuls visar rubrik, källa, tid och länk. Artikeln läses alltid hos originalutgivaren.</p>
      </div>
      <div class="news-source-grid" id="news-source-grid"></div>
    </section>
    <div data-component="premium-ad-3"></div>
  </main>
  <div data-component="footer"></div>

  <dialog class="municipality-dialog" id="municipality-dialog">
    <form method="dialog">
      <button class="dialog-close" type="submit" value="cancel" aria-label="Stäng"><i data-lucide="x"></i></button>
      <span class="dialog-icon"><i data-lucide="map-pin"></i></span>
      <h2>Vilken kommun vill du följa?</h2>
      <p>DinPuls anpassar innehållet efter platsen du väljer.</p>
      <label for="municipality-select">Kommun</label>
      <select id="municipality-select"></select>
      <button class="primary-button" id="save-municipality" type="submit" value="default">Spara kommun</button>
    </form>
  </dialog>

  <script src="assets/vendor/lucide.min.js"></script>
  <script src="dp-safety.js?version=0.23.4"></script>
  <script src="dp-core.js?version=0.23.4"></script>
  <script src="municipality-engine.js?version=0.23.4"></script>
  <script src="sport-data-engine.js?version=0.23.4"></script>
  <script src="script.js?version=0.23.4-amal-news-1"></script>
  <script src="privacy-controls.js?version=0.23.4"></script>
</body>
</html>
